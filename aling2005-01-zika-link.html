<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>传讯 - 应用入口</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #ff9f9d, #ff6b6b);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: #fff;
            border-radius: 24px;
            padding: 40px 32px;
            max-width: 380px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
        }
        .icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #ff9f9d, #ff6b6b);
            border-radius: 22px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: #fff;
            font-weight: bold;
        }
        h1 {
            font-size: 22px;
            color: #333;
            margin-bottom: 8px;
        }
        p {
            font-size: 14px;
            color: #888;
            margin-bottom: 28px;
            line-height: 1.6;
        }
        .btn {
            display: inline-block;
            background: linear-gradient(135deg, #ff9f9d, #ff6b6b);
            color: #fff;
            text-decoration: none;
            padding: 14px 40px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 8px 24px rgba(255,107,107,0.3);
        }
        .btn:active { transform: scale(0.96); }
        .url {
            margin-top: 20px;
            font-size: 12px;
            color: #bbb;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">传</div>
        <h1>传讯</h1>
        <p>你的专属聊天伴侣应用<br>点击下方按钮进入</p>
        <a href="https://aling2005-01.github.io/aling2005-01-zika/source.html" class="btn">进入应用</a>
        <div class="url">https://aling2005-01.github.io/aling2005-01-zika/source.html</div>
    </div>
</body>
</html>
